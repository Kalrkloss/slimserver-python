[project]
name = "lyrion"
version = "9.2.0"
description = "Pyrion Music Server - streaming audio server for Squeezebox players"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0",
    "uvloop>=0.20",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "pillow>=11.0",
    "mutagen>=1.47",
    "pymediainfo>=6.1",
    "jinja2>=3.1",
    "orjson>=3.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-magic>=0.4",
    "watchdog>=4.0",
    "cryptography>=43.0",
    "sqlalchemy>=2.0",
    "aiofiles>=24.0",
    "cbor2>=5.6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]
full = ["aiodns", "aiohttp", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
lyrion = "lyrion.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lyrion"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# controller-compat contract tests (live server) are marked 'contract';
# they run when a server is up, otherwise they skip.
addopts = "-raX"
markers = [
    "contract: live-server controller-compat contract tests (require an LMS server up)",
]
