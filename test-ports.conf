# Test-Config für den Python-LMS — Ports abseits des laufenden LMS
# (9000 public / 9001 internal / 3483 discovery / 9090 CLI).
#
# Ein-Port-Layout (Commit 54a201363, Perl-Parität): `public_http_port` ist der
# nativer, pipelining-fähige Frontend-Server, den alle Clients sehen;
# `internal_http_port` ist uvicorn, nur an 127.0.0.1 gebunden, dahinter.
# Der Test-Fixture (tests/conftest.py) wartet auf den PUBLIC-Port — vorher stand
# hier `serverport`, ein Schlüssel aus der Zeit vor der Konsolidierung, weshalb
# der Testserver auf 9000 startete und mit dem laufenden Server kollidierte.
public_http_port = 9002
internal_http_port = 9003
slimproto_port = 3484
cliport = 9091
