<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyrion Music Server</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --body-bg: #FFFFFF;
  --alt-row: #F5F5F5;
  --border: #d0d0d0;
  --accent: #3384C7;
  --accent-hover: #2670b0;
  --text: #333333;
  --text-light: #666666;
  --link: #3384C7;
  --sidebar-w: 210px;
  --topbar-h: 52px;
  --statusbar-h: 36px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  font-size: 13px;
  background: var(--body-bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Top Bar ── */
#topbar {
  height: var(--topbar-h);
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 16px;
  flex-shrink: 0;
  white-space: nowrap;
}
#topbar .logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: bold;
  font-size: 15px;
}
#topbar .logo svg { width: 28px; height: 28px; }
#topbar .topbar-info {
  display: flex;
  gap: 20px;
  font-size: 12px;
  opacity: 0.9;
}
#topbar .topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  padding: 4px 12px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.15s;
}
.btn:hover { background: rgba(255,255,255,0.25); }
.btn-sm { padding: 2px 8px; font-size: 11px; }

/* ── Layout ── */
#layout { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--alt-row);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
.nav-section { padding: 8px 0 4px; }
.nav-section-title {
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  color: var(--text-light);
  padding: 6px 12px 2px;
  letter-spacing: 0.5px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  cursor: pointer;
  color: var(--text);
  text-decoration: none;
  font-size: 13px;
  border-left: 3px solid transparent;
  transition: background 0.1s;
}
.nav-item:hover { background: rgba(51,132,199,0.1); }
.nav-item.active {
  background: rgba(51,132,199,0.15);
  border-left-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.nav-item .icon { font-size: 15px; width: 18px; text-align: center; }
.nav-sub { padding-left: 24px; font-size: 12px; }
.nav-sub .nav-item { padding: 5px 12px; }
#sidebar-toggle {
  display: none;
  padding: 8px 12px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text);
  font-size: 13px;
  text-align: left;
  width: 100%;
}

/* ── Main ── */
#main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}
#main.padded { padding: 16px; }

/* ── Page Header ── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.page-header h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
}
.page-header h1 .sub { font-size: 13px; font-weight: normal; color: var(--text-light); }

/* ── Tabs ── */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  gap: 0;
  margin-bottom: 16px;
}
.tab {
  padding: 8px 16px;
  cursor: pointer;
  color: var(--text-light);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s;
  font-size: 13px;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}
.tab:hover { color: var(--text); }
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

/* ── Tables ── */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  background: var(--alt-row);
  text-align: left;
  padding: 7px 10px;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--text-light);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tr:nth-child(even) td { background: var(--alt-row); }
tr:hover td { background: rgba(51,132,199,0.07); cursor: pointer; }
tr:hover td.row-alt { background: rgba(51,132,199,0.12); }

/* ── Forms ── */
input[type="text"], input[type="search"], select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 13px;
  font-family: inherit;
  background: var(--body-bg);
  color: var(--text);
  outline: none;
}
input[type="text"]:focus, input[type="search"]:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(51,132,199,0.15);
}
input[type="range"] {
  -webkit-appearance: none;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 7px 16px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary {
  background: var(--alt-row);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 7px 16px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: background 0.15s;
}
.btn-secondary:hover { background: #e8e8e8; }

.radio-panel { padding: 8px 4px 4px; }
.radio-panel h3 { font-size: 12px; margin: 10px 0 6px; color: var(--text-light); }
.radio-result {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 8px; border-bottom: 1px solid var(--border);
}
.radio-result:last-child { border-bottom: none; }
.radio-result strong { font-size: 13px; }
.btn-danger {
  background: #c0392b;
  color: #fff;
  border: none;
  padding: 7px 16px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: background 0.15s;
}
.btn-danger:hover { background: #a93226; }

/* ── Cards ── */
.card {
  background: var(--body-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.info-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 16px;
  font-size: 13px;
}
.info-grid .label { color: var(--text-light); font-weight: 600; }

/* ── Pagination ── */
.pagination {
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: center;
  padding: 12px 0;
}
.pagination button {
  background: var(--alt-row);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  color: var(--text);
}
.pagination button:hover:not(:disabled) { background: #e0e0e0; }
.pagination button:disabled { opacity: 0.4; cursor: default; }
.pagination .page-info { font-size: 12px; color: var(--text-light); }

/* ── Search box ── */
.search-box {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.search-box input { flex: 1; max-width: 400px; }

/* ── Now Playing ── */
.nowplaying-layout {
  display: grid;
  grid-template-columns: 220px 1fr 260px;
  gap: 20px;
  align-items: start;
}
.album-art {
  width: 200px;
  height: 200px;
  background: var(--alt-row);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--border);
  font-size: 60px;
  border-radius: 4px;
  flex-shrink: 0;
}
.track-info { padding: 4px 0; }
.track-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.track-artist { font-size: 14px; color: var(--accent); margin-bottom: 2px; }
.track-album { font-size: 13px; color: var(--text-light); margin-bottom: 2px; }
.track-year { font-size: 12px; color: var(--text-light); }
.progress-section { margin: 16px 0; }
.progress-bar-wrap {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  margin: 4px 0;
  cursor: pointer;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.5s linear;
}
.progress-time { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-light); }
.controls-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.ctrl-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  background: var(--alt-row);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.ctrl-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.ctrl-btn.play-btn {
  width: 48px;
  height: 48px;
  font-size: 20px;
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.ctrl-btn.play-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.ctrl-btn.off { opacity: 0.4; }
.ctrl-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.volume-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.volume-row input[type="range"] { width: 100px; }
.player-select-row { margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.player-select-row select { max-width: 300px; }
.playlist-queue {
  background: var(--alt-row);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.playlist-queue-title {
  padding: 8px 12px;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  background: #e8e8e8;
  border-bottom: 1px solid var(--border);
}
.playlist-queue-list {
  max-height: 400px;
  overflow-y: auto;
}
.queue-item {
  padding: 6px 12px;
  font-size: 12px;
  border-bottom: 1px solid rgba(208,208,208,0.5);
  cursor: pointer;
  display: flex;
  gap: 6px;
  transition: background 0.1s;
}
.queue-item:hover { background: rgba(51,132,199,0.1); }
.queue-item.playing { background: rgba(51,132,199,0.15); color: var(--accent); font-weight: 600; }
.queue-item .qi-num { color: var(--text-light); min-width: 20px; }
.queue-item .qi-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue-item .qi-artist { color: var(--text-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Status Bar ── */
#statusbar {
  height: var(--statusbar-h);
  background: var(--alt-row);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 20px;
  font-size: 12px;
  flex-shrink: 0;
  color: var(--text-light);
}
#statusbar .sb-player { font-weight: 600; color: var(--text); }
#statusbar .sb-sep { color: var(--border); }
#statusbar .sb-mode { font-style: italic; }

/* ── Loading / Error ── */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 32px;
  color: var(--text-light);
  font-size: 13px;
}
.loading::before {
  content: '';
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err-msg {
  padding: 12px 16px;
  background: #fdf2f2;
  border: 1px solid #f5c6c6;
  border-radius: 4px;
  color: #c0392b;
  font-size: 13px;
  margin: 8px 0;
}
.empty-msg {
  padding: 32px;
  text-align: center;
  color: var(--text-light);
  font-size: 13px;
}

/* ── Settings ── */
.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.settings-card {
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.settings-card-header {
  background: var(--alt-row);
  padding: 8px 14px;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  border-bottom: 1px solid var(--border);
}
.settings-card-body { padding: 14px; }

/* ── Browse row detail ── */
.browse-row-detail {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}
.browse-row-detail:hover { background: rgba(51,132,199,0.05); }
.browse-row-detail .browse-icon {
  width: 40px;
  height: 40px;
  background: var(--alt-row);
  border: 1px solid var(--border);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--text-light);
  flex-shrink: 0;
}
.browse-row-detail .browse-info { flex: 1; min-width: 0; }
.browse-row-detail .browse-name { font-weight: 600; font-size: 13px; }
.browse-row-detail .browse-sub { font-size: 12px; color: var(--text-light); }

/* ── Responsive ── */
@media (max-width: 768px) {
  #sidebar {
    position: fixed;
    left: 0;
    top: var(--topbar-h);
    bottom: var(--statusbar-h);
    z-index: 100;
    transform: translateX(-100%);
    transition: transform 0.2s;
    box-shadow: 2px 0 8px rgba(0,0,0,0.15);
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar-toggle { display: block; }
  .nowplaying-layout {
    grid-template-columns: 1fr;
  }
  .album-art { width: 100%; height: 200px; }
  .settings-grid { grid-template-columns: 1fr; }
}

/* ── Scrollbars ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--alt-row); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #bbb; }

/* Action buttons in table rows */
.row-actions { display: flex; gap: 4px; }
.row-actions button {
  background: none;
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  background: var(--body-bg);
  color: var(--text);
}
.row-actions button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Badge */
.badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.badge-blue { background: rgba(51,132,199,0.15); color: var(--accent); }
.badge-green { background: rgba(39,174,96,0.15); color: #27ae60; }
.badge-red { background: rgba(192,57,43,0.15); color: #c0392b; }

/* Scrollable content within page */
.page-scroll { flex: 1; overflow-y: auto; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <button id="sidebar-toggle" onclick="toggleSidebar()">☰ Menu</button>
  <div class="logo">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="14" r="13" stroke="white" stroke-width="2"/>
      <circle cx="14" cy="14" r="4" fill="white"/>
      <path d="M14 4 L14 8 M14 20 L14 24 M4 14 L8 14 M20 14 L24 14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    Pyrion Music Server
  </div>
  <div class="topbar-info">
    <span id="server-version">Server: v—</span>
    <span id="server-players">Players: —</span>
  </div>
  <div class="topbar-right">
    <button class="btn" id="refresh-btn" onclick="refreshAll()">&#8635; Refresh</button>
  </div>
</div>

<!-- LAYOUT -->
<div id="layout">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="nav-section">
      <a class="nav-item" href="#/nowplaying" data-nav="nowplaying">
        <span class="icon">♪</span> Now Playing
      </a>
      <a class="nav-item" href="#/search" data-nav="search">
        <span class="icon">🔍</span> Search
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Browse Music</div>
      <a class="nav-item" href="#/browse/artists" data-nav="browse">
        <span class="icon">👤</span> Artists
      </a>
      <a class="nav-item" href="#/browse/albums" data-nav="browse">
        <span class="icon">💿</span> Albums
      </a>
      <a class="nav-item" href="#/browse/songs" data-nav="browse">
        <span class="icon">🎵</span> Songs
      </a>
      <a class="nav-item" href="#/browse/genres" data-nav="browse">
        <span class="icon">🏷</span> Genres
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Radio</div>
      <a class="nav-item" href="#/favorites" data-nav="favorites">
        <span class="icon">⭐</span> Favorites
      </a>
      <a class="nav-item" href="#/browse/radio" data-nav="browse">
        <span class="icon">📻</span> Internet Radio
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Playlists</div>
      <a class="nav-item" href="#/playlist" data-nav="playlist">
        <span class="icon">🎶</span> Playlist
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Settings</div>
      <a class="nav-item" href="#/settings/server" data-nav="settings">
        <span class="icon">⚙</span> Server Settings
      </a>
      <a class="nav-item" href="#/settings/players" data-nav="settings">
        <span class="icon">🔊</span> Player Settings
      </a>
    </div>

    <div class="nav-section">
      <div class="nav-section-title">Extras</div>
      <a class="nav-item" href="#/settings/plugins" data-nav="settings">
        <span class="icon">🔌</span> Plugins
      </a>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main id="main">
    <div id="page-content" class="page-scroll"></div>
  </main>
</div>

<!-- STATUS BAR -->
<div id="statusbar">
  <span class="sb-player" id="sb-player">No player selected</span>
  <span class="sb-sep">|</span>
  <span id="sb-track">—</span>
  <span class="sb-sep">|</span>
  <span class="sb-mode" id="sb-mode">—</span>
  <span class="sb-notice" id="sb-notice" style="display:none;margin-left:8px;color:var(--warn);font-weight:600;"></span>
  <span id="sb-scan" style="display:none;margin-left:8px;color:var(--accent);font-weight:600;">🔍 <span id="sb-scan-text"></span></span>
  <span id="sb-vol" style="margin-left:auto">
    <span>🔊</span>
    <span id="sb-volume">—</span>
  </span>
</div>

<script>
// ─────────────────────────────────────────────
//  APP STATE
// ─────────────────────────────────────────────
const appState = {
  version: '',
  players: [],
  currentPlayer: null,
  playlist: [],
  currentTrackIndex: -1,
  isPlaying: false,
  repeat: false,
  shuffle: false,
  browseData: [],
  browseTotal: 0,
  browseType: 'artists',
  browsePage: 0,
  favFolder: null,
  searchResults: [],
  searchType: 'all',
  searchQuery: '',
  loading: false,
  error: null,
  refreshInterval: null,
  npPollInterval: null,
  alarmPlayer: null,   // per-player alarm settings selection (mac)
};

// ─────────────────────────────────────────────
//  API
// ─────────────────────────────────────────────
async function api(method, params) {
  try {
    const resp = await fetch('/jsonrpc.js', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', method, params, id: 1 }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    return data.result;
  } catch (e) {
    console.error('API error:', method, e);
    throw e;
  }
}

// ─────────────────────────────────────────────
//  ROUTER
// ─────────────────────────────────────────────
function parseRoute() {
  const hash = location.hash || '#/nowplaying';
  const parts = hash.replace('#', '').split('/').filter(Boolean);
  const page = parts[0] || 'nowplaying';
  const id = parts.slice(1).join('/') || null;
  return { page, id };
}

async function navigate() {
  const { page, id } = parseRoute();
  updateActiveNav();
  const content = document.getElementById('page-content');
  content.innerHTML = '';
  content.className = 'page-scroll';

  try {
    switch (page) {
      case 'nowplaying':    await renderNowPlaying(id); break;
      case 'search':        await renderSearch(id); break;
      case 'browse':        await renderBrowse(id || 'artists'); break;
      case 'favorites':     await renderFavorites(id); break;
      case 'playlist':      await renderPlaylist(id); break;
      case 'settings':     await renderSettings(id || 'server'); break;
      default:              await renderNowPlaying(id);
    }
  } catch (e) {
    content.innerHTML = `<div class="err-msg">Error loading page: ${escHtml(e.message)}</div>`;
  }
}

function updateActiveNav() {
  const { page } = parseRoute();
  document.querySelectorAll('.nav-item').forEach(el => {
    const nav = el.dataset.nav || '';
    const href = el.getAttribute('href') || '';
    const isActive = href === `#/${page}` || (page === 'browse' && nav === 'browse') ||
                     (page === 'settings' && nav === 'settings') ||
                     (page === 'nowplaying' && page === 'nowplaying');
    // Simple exact match for most navs
    let active = false;
    if (page === 'nowplaying' && href === '#/nowplaying') active = true;
    else if (page === 'search' && href === '#/search') active = true;
    else if (page === 'playlist' && href === '#/playlist') active = true;
    else if (page === 'favorites' && href.startsWith('#/favorites')) active = true;
    else if (page === 'browse' && href.startsWith('#/browse')) active = true;
    else if (page === 'settings' && href.startsWith('#/settings')) active = true;
    el.classList.toggle('active', active);
  });
}

window.addEventListener('hashchange', navigate);

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function escHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmtDur(secs) {
  if (!secs || isNaN(secs)) return '—';
  const s = Math.floor(secs);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return `${h}:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  return `${m}:${String(s%60).padStart(2,'0')}`;
}

function loadingEl(msg) {
  return `<div class="loading">${msg || 'Loading…'}</div>`;
}

function emptyEl(msg) {
  return `<div class="empty-msg">${escHtml(msg)}</div>`;
}

function errEl(msg) {
  return `<div class="err-msg">${escHtml(msg)}</div>`;
}

function setLoading(el, bool) {
  if (bool) el.innerHTML = loadingEl();
  appState.loading = bool;
}

async function withLoading(el, fn) {
  setLoading(el, true);
  try {
    const html = await fn();
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = errEl(e.message);
  } finally {
    setLoading(el, false);
  }
}

async function refreshServerInfo() {

    const status = await api('server.status');
    document.getElementById('server-players').textContent = `Players: ${status.players ?? '?'}`;
  } catch(e) {
    document.getElementById('server-version').textContent = 'Server: unreachable';
    document.getElementById('server-players').textContent = '';
  }
}

async function refreshPlayers() {
  try {
    appState.players = await api('player.list');
    if (appState.players && appState.players.length > 0) {
      const saved = sessionStorage.getItem('currentPlayer');
      if (saved && appState.players.find(p => p.mac === saved)) {
        appState.currentPlayer = saved;
      } else {
        appState.currentPlayer = appState.players[0].mac;
        sessionStorage.setItem('currentPlayer', appState.currentPlayer);
      }
    } else {
      appState.currentPlayer = null;
    }
  } catch(e) {
    appState.players = [];
    appState.currentPlayer = null;
  }
}

async function refreshStatus() {
  // Status-bar notice always reflects the server (e.g. missing ffmpeg),
  // independent of any selected player.
  try {
    const ss = await api('slim.request', ['-', ['serverstatus', '0', '1']]);
    const notice = (ss && typeof ss === 'object') ? (ss.notice || '') : '';
    const el = document.getElementById('sb-notice');
    if (el) {
      el.textContent = notice || '';
      el.style.display = notice ? 'inline' : 'none';
    }
    // Library-scan indicator: "🔍 Scan läuft — N Dateien" while scanning.
    const scanEl = document.getElementById('sb-scan');
    if (scanEl) {
      const scan = (ss && typeof ss === 'object') ? ss.scan : null;
      if (scan && scan.scanning) {
        const done = scan.done_files || 0;
        document.getElementById('sb-scan-text').textContent =
          `Scan läuft — ${done} Dateien gefunden`;
        scanEl.style.display = 'inline';
      } else {
        scanEl.style.display = 'none';
      }
    }
  } catch(e) { /* ignore — notice is best-effort */ }

  if (!appState.currentPlayer) {
    appState.isPlaying = false;
    appState.currentTrackIndex = -1;
    appState.playlist = [];
    updateStatusBar();
    return;
  }
  try {
    const st = await api('player.status', [appState.currentPlayer]);
    // player.status returns a JSON object (web API), not CLI lines
    appState.isPlaying = st.mode === 'playing';
    if (st.playlist_cur_index !== undefined) {
      appState.currentTrackIndex = st.playlist_cur_index >= 0 ? st.playlist_cur_index : -1;
    }
    // playlist.tracks (web API) already returns JSON objects
    appState.playlist = await api('playlist.tracks', [appState.currentPlayer]);
    updateStatusBar();
  } catch(e) {
    appState.playlist = [];
  }
}

function updateStatusBar() {
  const player = appState.players.find(p => p.mac === appState.currentPlayer);
  document.getElementById('sb-player').textContent = player ? `Player: ${player.name || player.mac}` : 'No player';
  const track = appState.currentTrackIndex >= 0 ? appState.playlist[appState.currentTrackIndex] : null;
  document.getElementById('sb-track').textContent = track ? `${track.title || 'Unknown'} — ${track.artist || 'Unknown'}` : '—';
  document.getElementById('sb-mode').textContent = appState.isPlaying ? 'Playing' : (player && player.power ? 'Paused' : 'Stopped');
  document.getElementById('sb-volume').textContent = player ? `${player.volume ?? '—'}%` : '—';
}

// Poll the player status so the Now Playing play/pause icon and the
// status bar stay in sync with the real server state (e.g. after a pause
// or when a track auto-advances). Quick interval on the Now Playing page.
async function startStatusPoll() {
  try {
    return await pollNowPlaying();
  } catch (e) { /* silent */ }
}

async function pollNowPlaying() {
  // Only refresh the Now Playing panel if we're on it (avoid extra work and
  // DOM churn on other pages). Server state is the source of truth.
  const onNowPlaying = (location.hash || '').startsWith('#/nowplaying');
  if (!onNowPlaying || !appState.currentPlayer) return;
  try {
    await refreshNowPlayingContent();
  } catch (e) { /* silent */ }
}

// Refresh queue/metadata (playlist tracks, status) WITHOUT touching the
// play/pause icon, so a call right after a toggle command doesn't overwrite
// the icon with a stale server status that hasn't caught up yet.
async function refreshNowPlayingData() {
  if (!appState.currentPlayer) return;
  try {
    const st = await api('player.status', [appState.currentPlayer]);
    if (st.playlist_cur_index !== undefined) {
      appState.currentTrackIndex = st.playlist_cur_index >= 0 ? st.playlist_cur_index : -1;
    }
    appState.playlist = await api('playlist.tracks', [appState.currentPlayer]);
  } catch (e) { /* silent */ }
}

// Update just the play/pause button icon + title from appState.isPlaying.
function updatePlayButton() {
  const btn = document.getElementById('play-btn');
  if (!btn) return;
  btn.textContent = appState.isPlaying ? '\u23F8' : '\u25B6';
  btn.title = appState.isPlaying ? 'Pause' : 'Play';
}

async function refreshNowPlayingContent() {
  const layout = document.getElementById('np-layout');
  if (!layout) return;

  if (!appState.currentPlayer) {
    layout.innerHTML = `<div class="empty-msg" style="grid-column:1/-1">No players connected. Connect a player to start.</div>`;
    updateStatusBar();
    return;
  }

  try {
    const [st, vol, pwr] = await Promise.all([
      api('player.status', [appState.currentPlayer]),
      api('player.volume', [appState.currentPlayer]),
      api('player.power', [appState.currentPlayer]),
    ]);

    // player.status returns a JSON object (web API)
    appState.isPlaying = st.mode === 'playing';
    if (st.playlist_cur_index !== undefined) {
      appState.currentTrackIndex = st.playlist_cur_index >= 0 ? st.playlist_cur_index : -1;
    }
    // playlist.tracks (web API) already returns JSON objects
    appState.playlist = await api('playlist.tracks', [appState.currentPlayer]);

    const track = appState.currentTrackIndex >= 0 && appState.playlist[appState.currentTrackIndex]
      ? appState.playlist[appState.currentTrackIndex]
      : null;

    // Live stream metadata (from StreamTitle via player.status) takes
    // precedence over the static playlist entry title — this is the actual
    // song + artist currently playing on a radio stream.
    const rm = (st && st.remote_meta) || {};
    const isStream = track && track.url && !track.track_id ? true : false;
    const nowTitle = (isStream && rm.title) ? rm.title : (track ? track.title : null);
    const nowArtist = (isStream && rm.artist) ? rm.artist : (track ? (track.artist || '') : '');

    // Album art
    const artEl = track && track.artwork_url
      ? `<img src="${escHtml(track.artwork_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:4px" onerror="this.parentElement.innerHTML='<span style=\\'font-size:60px;color:#d0d0d0\\'>♫</span>'">`
      : `<span style="font-size:60px;color:#d0d0d0">♫</span>`;

    // Progress
    const progress = track && track.duration && track.current_index !== undefined
      ? `${fmtDur(track.current_index)} / ${fmtDur(track.duration)}`
      : (track ? `0:00 / ${fmtDur(track.duration)}` : '');

    // Playlist queue
    let queueHtml = '';
    if (appState.playlist && appState.playlist.length > 0) {
      queueHtml = `
        <div class="playlist-queue">
          <div class="playlist-queue-title">Queue (${appState.playlist.length} tracks)</div>
          <div class="playlist-queue-list">
            ${appState.playlist.map((t, i) => `
              <div class="queue-item ${i === appState.currentTrackIndex ? 'playing' : ''}" onclick="playTrack(${i})">
                <span class="qi-num">${i + 1}</span>
                <div style="flex:1;min-width:0">
                  <div class="qi-title">${escHtml(t.title || 'Unknown')}</div>
                  <div class="qi-artist">${escHtml(t.artist || 'Unknown')}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    } else {
      queueHtml = `<div class="empty-msg">Playlist is empty. Browse music to add tracks.</div>`;
    }

    layout.innerHTML = `
      <!-- Left: Album Art -->
      <div>
        <div class="album-art">${artEl}</div>
      </div>

      <!-- Center: Track Info + Controls -->
      <div>
        ${track ? `
          <div class="track-title">${escHtml(nowTitle || 'No track playing')}</div>
          <div class="track-artist">${escHtml(nowArtist || '—')}</div>
          <div class="track-album">${escHtml(track.album || '—')}${track.year ? ` (${track.year})` : ''}</div>
          ${track.duration ? `
            <div class="progress-section">
              <div class="progress-bar-wrap" onclick="seekProgress(event, this)">
                <div class="progress-bar-fill" style="width:${track.current_index && track.duration ? Math.round(track.current_index/track.duration*100) : 0}%"></div>
              </div>
              <div class="progress-time">
                <span>${fmtDur(track.current_index || 0)}</span>
                <span>${fmtDur(track.duration)}</span>
              </div>
            </div>
          ` : ''}
        ` : `<div class="track-title" style="color:var(--text-light)">Nothing playing</div>`}

        <div class="controls-row">
          <button class="ctrl-btn" onclick="prevTrack()" title="Previous">⏮</button>
          <button class="ctrl-btn play-btn ${appState.isPlaying ? '' : ''}" onclick="togglePlay()" id="play-btn" title="${appState.isPlaying ? 'Pause' : 'Play'}">
            ${appState.isPlaying ? '⏸' : '▶'}
          </button>
          <button class="ctrl-btn" onclick="nextTrack()" title="Next">⏭</button>

          <div class="volume-row" style="margin-left:16px">
            <span>🔊</span>
            <input type="range" min="0" max="100" value="${vol || 0}" onchange="setVolume(this.value)" title="Volume">
            <span style="min-width:30px">${vol}%</span>
          </div>
        </div>

        <div class="controls-row" style="margin-top:8px">
          <button class="ctrl-btn ${appState.repeat ? 'active' : ''}" onclick="toggleRepeat()" title="Repeat">🔁</button>
          <button class="ctrl-btn ${appState.shuffle ? 'active' : ''}" onclick="toggleShuffle()" title="Shuffle">🔀</button>
          <button class="ctrl-btn" onclick="stopPlaylist()" title="Stop">⏹</button>
          <button class="ctrl-btn ${pwr ? 'active' : ''}" onclick="togglePower()" title="Power" id="power-btn" style="margin-left:8px">
            ⏻
          </button>
        </div>
      </div>

      <!-- Right: Queue -->
      <div>${queueHtml}</div>
    `;

  } catch(e) {
    layout.innerHTML = `<div class="err-msg" style="grid-column:1/-1">${escHtml(e.message)}</div>`;
  }

  updateStatusBar();
}

async function onPlayerChange(mac) {
  appState.currentPlayer = mac;
  sessionStorage.setItem('currentPlayer', mac);
  await refreshStatus();
  await refreshNowPlayingContent();
}

let toggleQueued = false;
let toggleInFlight = false;
async function togglePlay() {
  if (!appState.currentPlayer) return;
  // Serialize rapid clicks: while a toggle command is in flight, remember
  // that another click arrived and run ONE more toggle when it settles.
  // Without this, two fast clicks both read the pre-command status and both
  // send 'play' — the player keeps restarting instead of pausing.
  if (toggleQueued) return;
  if (toggleInFlight) { toggleQueued = true; return; }
  toggleInFlight = true;
  try {
    // Read the REAL server state, not the (possibly stale) local isPlaying.
    // Otherwise toggling never leaves the play branch and the player just
    // keeps restarting instead of pausing.
    const st = await api('player.status', [appState.currentPlayer]);
    const playing = st.mode === 'playing';
    if (playing) {
      await api('playlist.pause', [appState.currentPlayer, 1]);
      appState.isPlaying = false;
    } else {
      const idx = appState.currentTrackIndex >= 0
        ? appState.currentTrackIndex
        : (appState.playlist.length > 0 ? 0 : -1);
      if (idx >= 0) {
        await api('playlist.play', [appState.currentPlayer, idx]);
        appState.currentTrackIndex = idx;
        appState.isPlaying = true;
      }
    }
    // Update the icon immediately from the intended state; the server's
    // status may lag the command (async stream start), so don't wait for
    // a stale player.status that still reports the previous mode.
    updatePlayButton();
    updateStatusBar();
    // Refresh the underlying data (queue, metadata) WITHOUT re-reading
    // isPlaying — the poll loop below reconciles the icon with the real
    // server state (≤3s), so a right-after-command status read (which may
    // still report the pre-command mode) never flips the icon back.
    await refreshNowPlayingData();
  } catch(e) {
    console.error(e);
    // API call failed (e.g. server unreachable): the optimistic state we set
    // above may not reflect reality. Revert isPlaying so the icon flips back,
    // and let the next status poll reconcile with the real server state.
    appState.isPlaying = false;
    updatePlayButton();
  }
  finally {
    toggleInFlight = false;
    // Re-run a queued click (real toggle, not a lost one).
    if (toggleQueued) { toggleQueued = false; togglePlay(); }
  }
}

async function prevTrack() {
  if (!appState.currentPlayer) return;
  try {
    await api('playlist.prev', [appState.currentPlayer]);
    appState.currentTrackIndex = Math.max(0, appState.currentTrackIndex - 1);
    appState.isPlaying = true;
    await refreshNowPlayingContent();
  } catch(e) { console.error(e); }
}

async function nextTrack() {
  if (!appState.currentPlayer) return;
  try {
    await api('playlist.next', [appState.currentPlayer]);
    appState.currentTrackIndex = Math.min(appState.playlist.length - 1, appState.currentTrackIndex + 1);
    appState.isPlaying = true;
    await refreshNowPlayingContent();
  } catch(e) { console.error(e); }
}

async function playTrack(index) {
  if (!appState.currentPlayer) return;
  try {
    await api('playlist.play', [appState.currentPlayer, index]);
    appState.currentTrackIndex = index;
    appState.isPlaying = true;
    await refreshNowPlayingContent();
  } catch(e) { console.error(e); }
}

async function stopPlaylist() {
  if (!appState.currentPlayer) return;
  try {
    await api('playlist.stop', [appState.currentPlayer]);
    appState.isPlaying = false;
    await refreshNowPlayingContent();
    updateStatusBar();
  } catch(e) { console.error(e); }
}

async function setVolume(level) {
  if (!appState.currentPlayer) return;
  try {
    await api('player.volume', [appState.currentPlayer, parseInt(level)]);
    const player = appState.players.find(p => p.mac === appState.currentPlayer);
    if (player) player.volume = parseInt(level);
    document.getElementById('sb-volume').textContent = `${level}%`;
  } catch(e) { console.error(e); }
}

async function togglePower() {
  if (!appState.currentPlayer) return;
  try {
    const player = appState.players.find(p => p.mac === appState.currentPlayer);
    const newPower = !(player && player.power);
    await api('player.power', [appState.currentPlayer, newPower]);
    if (player) player.power = newPower;
    await refreshNowPlayingContent();
  } catch(e) { console.error(e); }
}

function toggleRepeat() {
  appState.repeat = !appState.repeat;
  refreshNowPlayingContent();
}

function toggleShuffle() {
  appState.shuffle = !appState.shuffle;
  refreshNowPlayingContent();
}

async function renderSearch() {
  const el = document.getElementById('page-content');
  el.className = 'page-scroll';
  el.innerHTML = `
    <div style="padding:16px">
      <div class="page-header">
        <h1>Search <span class="sub">Find music in your library</span></h1>
      </div>
      <div class="search-box">
        <input type="search" id="search-input" placeholder="Search artists, albums, songs, radio…" autofocus onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn-primary" onclick="doSearch()">Search</button>
      </div>
      <div class="tabs" id="search-tabs">
        <button class="tab active" onclick="setSearchType('all')">All</button>
        <button class="tab" onclick="setSearchType('artists')">Artists</button>
        <button class="tab" onclick="setSearchType('albums')">Albums</button>
        <button class="tab" onclick="setSearchType('songs')">Songs</button>
        <button class="tab" onclick="setSearchType('radio')">Radio</button>
      </div>
      <div id="search-results">${emptyEl('Enter a search term above to find music.')}</div>
    </div>
  `;
}

function setSearchType(type) {
  appState.searchType = type;
  document.querySelectorAll('#search-tabs .tab').forEach(t => t.classList.remove('active'));
  const tabs = { all: 0, artists: 1, albums: 2, songs: 3, radio: 4 };
  if (tabs[type] !== undefined) {
    document.querySelectorAll('#search-tabs .tab')[tabs[type]].classList.add('active');
  }
  if (appState.searchQuery) doSearch();
}

async function doSearch() {
  const input = document.getElementById('search-input');
  const query = input ? input.value.trim() : appState.searchQuery;
  if (!query) return;
  appState.searchQuery = query;
  const resultsEl = document.getElementById('search-results');
  setLoading(resultsEl, true);

  try {
    const results = { artists: [], albums: [], songs: [], radio: [] };
    const type = appState.searchType;

    // Use CLI commands via slim.request
    const req = async (cmd) => {
      try {
        return await api('slim.request', ['-', cmd]);
      } catch(e) { return []; }
    };

    if (type === 'all' || type === 'artists') {
      const r = await req(['search', '0', '100', 'tags:', query]);
      if (Array.isArray(r) && r.length > 0) {
        // Parse search results
        results.artists = r.filter(x => x.artist).slice(0, 20);
        results.albums = r.filter(x => x.album).slice(0, 20);
        results.songs = r.filter(x => x.title && !x.album).slice(0, 20);
      }
    }
    if (type === 'all' || type === 'albums') {
      const r = await req(['albums', '0', '50', 'tags:', 'album', query]);
      if (Array.isArray(r)) results.albums = r.slice(0, 50);
    }
    if (type === 'all' || type === 'songs') {
      const r = await req(['songs', '0', '50', 'tags:', 'title', query]);
      if (Array.isArray(r)) results.songs = r.slice(0, 50);
    }
    if (type === 'all' || type === 'radio') {
      const r = await req(['search', '0', '50', 'radio', query]);
      if (Array.isArray(r)) results.radio = r.slice(0, 50);
    }

    appState.searchResults = results;
    renderSearchResults(results);

  } catch(e) {
    resultsEl.innerHTML = errEl(e.message);
  }
}

function renderSearchResults(results) {
  const el = document.getElementById('search-results');
  if (!el) return;

  const { artists, albums, songs, radio } = results;

function browseTitle(type) {
  const map = { artists: 'Artists', albums: 'Albums', songs: 'Songs', genres: 'Genres', radio: 'Internet Radio' };
  return map[type] || type;
}

async function loadBrowseData() {
  const el = document.getElementById('browse-content');
  if (!el) return;
  setLoading(el, true);

  try {
    const page = appState.browsePage;
    const perPage = 50;
    const start = page * perPage;

    let data = [];
    let total = 0;

    const req = async (cmd) => {
      try {
        const r = await api('slim.request', ['-', cmd]);
        return r;
      } catch(e) { return []; }
    };

    // Server responses come as a JSON dict {count, item_loop, loop_loop}
    // (the same format the Android controllers use). Older/fallback
    // paths return CLI lines ("id:1","title:X") — keep the line parser
    // for those.
    const parse = (lines) => {
      const items = [];
      let cur = null;
      for (const line of lines) {
        if (typeof line !== 'string') continue;
        const t = line.trim();
        if (!t) { if (cur) { items.push(cur); cur = null; } continue; }
        const idx = t.indexOf(':');
        if (idx < 0) continue;
        const key = t.slice(0, idx).trim();
        const val = t.slice(idx + 1).trim();
        if (!key || !val) continue;
        if ((key === 'id' || key === 'radio id') && cur && Object.keys(cur).length > 0) { items.push(cur); cur = {}; }
        if (!cur) cur = {};
        cur[key] = val;
      }
      if (cur) items.push(cur);
      // Drop noise objects without identifying fields
      return items.filter(o => o.id || o.name || o.title);
    };

    const fromResponse = (r) => {
      if (r && typeof r === 'object' && !Array.isArray(r)) {
        const items = r.item_loop || r.loop_loop || [];
        return { items, total: typeof r.count === 'number' ? r.count : items.length };
      }
      return { items: parse(Array.isArray(r) ? r : []), total: 0 };
    };

    switch (appState.browseType) {
      case 'artists': {
        const cmd = ['artists', start, perPage, 'tags:'];
        if (appState.browseSearch) cmd.push(`search:${appState.browseSearch}`);
        const { items, total: t } = fromResponse(await req(cmd));
        data = items; total = t || (data.length >= perPage ? start + perPage + 1 : start + data.length);
        break;
      }
      case 'albums': {
        const cmd = ['albums', start, perPage, 'tags:'];
        if (appState.browseSearch) cmd.push(`search:${appState.browseSearch}`);
        const { items, total: t } = fromResponse(await req(cmd));
        data = items; total = t || (data.length >= perPage ? start + perPage + 1 : start + data.length);
        break;
      }
      case 'songs': {
        const cmd = ['songs', start, perPage, 'tags:'];
        if (appState.browseSearch) cmd.push(`search:${appState.browseSearch}`);
        const { items, total: t } = fromResponse(await req(cmd));
        data = items; total = t || (data.length >= perPage ? start + perPage + 1 : start + data.length);
        break;
      }
      case 'genres': {
        const cmd = ['genres', start, perPage, 'tags:'];
        if (appState.browseSearch) cmd.push(`search:${appState.browseSearch}`);
        const { items, total: t } = fromResponse(await req(cmd));
        data = items; total = t || (data.length >= perPage ? start + perPage + 1 : start + data.length);
        break;
      }
      case 'radio': {
        // No browse table for radio — the panel (add stream + search) is
        // all there is; saved stations live under Favorites.
        data = [];
        total = 0;
        break;
      }
    }

    appState.browseData = data;
    appState.browseTotal = total;
    renderBrowseTable();

  } catch(e) {
    el.innerHTML = errEl(e.message);
  }
}

    case 'albums':

      html += data.map((a, i) => `
        <tr>
          <td>${page * perPage + i + 1}</td>

          </td>

      break;
    case 'songs':
      html += `<tr><th>#</th><th>Title</th><th>Artist</th><th>Album</th><th>Duration</th><th>Actions</th></tr></thead><tbody>`;
      html += data.map((s, i) => `
        <tr>
          <td>${page * perPage + i + 1}</td>
          <td>${escHtml(s.title || 'Unknown')}</td>
          <td>${escHtml(s.artist || '—')}</td>

            <button onclick="addSongToQueue(${i})">+ Playlist</button>
          </td>
        </tr>`).join('');
      break;
    case 'genres':
      html += `<tr><th>#</th><th>Genre</th><th>Actions</th></tr></thead><tbody>`;
      html += data.map((g, i) => `

async function addAlbumToPlaylist(album) {
  if (!appState.currentPlayer) { showToast('No player selected'); return; }
  try {
    // Resolve the album's tracks via the songs filter, then append them all.
    const r = await api('slim.request', ['-', ['songs', 0, 500, `search:${album}`]]);
    const items = (r && (r.titles_loop || r.item_loop || r.loop_loop)) || [];
    const ids = items.map(t => String(t.id)).filter(Boolean);
    if (!ids.length) { showToast(`Keine Tracks für "${album}" gefunden`); return; }
    for (const id of ids) {
      await api('slim.request', [appState.currentPlayer, ['playlist', 'add', id]]);
    }
    showToast(`Album "${album}" (${ids.length} Tracks) zur Playlist hinzugefügt`);
    if (typeof refreshStatus === 'function') refreshStatus();
    if (typeof refreshPlaylistContent === 'function') refreshPlaylistContent();
  } catch (e) {
    showToast('Fehler: ' + e.message);
  }
}

async function addSongToQueue(index) {
  if (!appState.currentPlayer) { showToast('No player selected'); return; }
  const song = appState.browseData[index];
  if (!song || !song.id) { showToast('No song id available'); return; }
  try {
    await api('slim.request', [appState.currentPlayer, ['playlist', 'add', String(song.id)]]);
    showToast(`"${song.title || song.id}" added to playlist`);
    if (typeof refreshStatus === 'function') refreshStatus();
    if (typeof refreshPlaylistContent === 'function') refreshPlaylistContent();
  } catch (e) {
    showToast('Failed to add: ' + e.message);
  }
}

async function playSongNow(index) {

  const song = appState.browseData[index];
  if (!song || !song.id) { showToast('No song id available'); return; }
  try {

    await api('slim.request', [appState.currentPlayer, ['playlist', 'add', String(song.id)]]);
    await api('playlist.play', [appState.currentPlayer, appState.playlist.length]);
    showToast(`Playing "${song.title || song.id}"`);
    if (typeof refreshStatus === 'function') refreshStatus();
    if (typeof refreshNowPlayingContent === 'function') refreshNowPlayingContent();

async function searchRadioStations() {
  const q = document.getElementById('radio-search').value.trim();
  if (!q) { showToast('Enter a search term'); return; }
  const el = document.getElementById('radio-results');
  if (!el) return;
  el.innerHTML = 'Searching…';
  try {
    const r = await api('slim.request', ['-', ['radio', 'search', q, '10']]);
    const items = [];
    let cur = null;
    for (const line of (Array.isArray(r) ? r : [])) {
      if (typeof line !== 'string') continue;
      const t = line.trim();
      if (!t) { if (cur) { items.push(cur); cur = null; } continue; }
      const idx = t.indexOf(':');
      if (idx < 0) continue;
      const key = t.slice(0, idx).trim(), val = t.slice(idx + 1).trim();
      if (!key || !val) continue;
      if ((key === 'id' || key === 'radio id') && cur && Object.keys(cur).length) { items.push(cur); cur = {}; }
      if (!cur) cur = {};
      cur[key] = val;
    }
    if (cur) items.push(cur);
    const found = items.filter(o => o.name);
    if (!found.length) { el.innerHTML = 'No stations found.'; return; }
    el.innerHTML = found.map(s => `
      <div class="radio-result">
        <div style="flex:1">
          <strong>${escHtml(s.name)}</strong>
          <div style="font-size:11px;color:var(--text-light)">${escHtml(s.genre || s.country || '')}</div>
          <div style="font-size:10px;color:var(--text-light);word-break:break-all">${escHtml(s.url || '')}</div>
        </div>
        <button class="btn-secondary btn-sm" onclick="addRadioResult('${escHtml(s.name).replace(/'/g, "\\'")}','${escHtml(s.url).replace(/'/g, "\\'")}')">+ Add</button>
      </div>`).join('');
  } catch (e) {
    el.innerHTML = 'Search failed: ' + escHtml(e.message);
  }
}

async function addRadioResult(name, url) {

    showToast('Failed: ' + e.message);

}

// ─────────────────────────────────────────────
//  PAGE: FAVORITES (radio streams + folders)
// ─────────────────────────────────────────────
let favFolders = [];

async function loadFavFolders() {
  try {
    const r = await api('slim.request', ['-', ['favorites', 'items']]);
    favFolders = parseFavItems(r).filter(f => f.type === 'folder');
  } catch (e) {
    favFolders = [];
  }
}

function favFolderOptions() {
  return favFolders
    .filter(f => String(f.fav_id) !== String(appState.favFolder || 0))
    .map(f => `<option value="${f.fav_id}">→ 📁 ${escHtml(f.title)}</option>`)
    .join('');
}

function parseFavItems(lines) {
  const items = [];
  // LMS JSON format (loop_loop with id/name/url/hasitems) — SqueezeTray
  // compatible. Directly map to the internal shape.
  if (lines && Array.isArray(lines.loop_loop)) {
    for (const it of lines.loop_loop) {
      if (!it || !it.id) continue;
      // Folder detection: server sends no 'type' for folders — they are
      // identified by hasitems:1 / isaudio:0 (streams carry type:'audio').
      const isFolder = it.type === 'folder'
        || Number(it.hasitems) === 1
        || (it.isaudio !== undefined && Number(it.isaudio) === 0 && !it.url);
      items.push({
        fav_id: String(it.id),
        title: it.name || it.title || '???',
        url: it.url || '',
        image: it.image || '',
        type: isFolder ? 'folder' : 'stream',
        hasitems: it.hasitems,
      });
    }
    return items;
  }
  // Fallback: CLI text format ("favorite id:" / "title:" / ...)
  let cur = null;
  for (const line of (Array.isArray(lines) ? lines : [])) {
    if (typeof line !== 'string') continue;
    const t = line.trim();
    if (!t) { if (cur) { items.push(cur); cur = null; } continue; }
    if (t.startsWith('favorite id:')) {
      if (cur) items.push(cur);
      cur = { fav_id: t.split(':')[1].trim() };
      continue;
    }
    if (cur && t.includes(':')) {
      const idx = t.indexOf(':');
      const k = t.slice(0, idx).trim();
      const v = t.slice(idx + 1).trim();
      if (k && v) cur[k] = v;
    }
  }
  if (cur) items.push(cur);
  return items.filter(o => o.fav_id && o.title);
}

// Parse "playlist tracks" CLI response into objects:
//   ["playlist tracks: 2", "id: 0", "track_id: 4011", "id: 1", "url: ...", "title: X"]
// → [{index, track_id, url, title}]
function parsePlaylistTracks(lines) {
  const items = [];
  let cur = null;
  for (const line of (Array.isArray(lines) ? lines : [])) {
    if (typeof line !== 'string') continue;
    const t = line.trim();
    if (!t) { if (cur) { items.push(cur); cur = null; } continue; }
    if (/^id: \d+$/.test(t)) {
      if (cur) items.push(cur);
      cur = { index: t.split(':')[1].trim() };
      continue;
    }
    if (cur && t.includes(':')) {
      const idx = t.indexOf(':');
      const k = t.slice(0, idx).trim();
      const v = t.slice(idx + 1).trim();
      if (k && v) cur[k] = v;
    }
  }
  if (cur) items.push(cur);
  return items;
}

// Parse "player.status" CLI response ("key: value" lines) into an object.
function parseCliPairs(lines) {
  const obj = {};
  for (const line of (Array.isArray(lines) ? lines : [])) {
    if (typeof line !== 'string') continue;
    const t = line.trim();
    if (!t || !t.includes(':')) continue;
    const idx = t.indexOf(':');
    const k = t.slice(0, idx).trim();
    const v = t.slice(idx + 1).trim();
    if (k && v) obj[k] = v;
  }
  return obj;
}

async function refreshFavorites() {
  const el = document.getElementById('favorites-content');
  if (!el) return;
  const parent = appState.favFolder;
  const bc = document.getElementById('fav-breadcrumb');
  if (bc) bc.textContent = parent ? `(Ordner ${parent})` : '(Alle)';

  let items = [];
  try {
    const cmd = parent ? ['favorites', 'items', `item_id:${parent}`]
                       : ['favorites', 'items'];
    const r = await api('slim.request', ['-', cmd]);
    items = parseFavItems(r);
    appState.favItems = items;
    await loadFavFolders();
  } catch (e) {
    el.innerHTML = errEl(e.message);
    return;
  }

  if (!items.length) {
    el.innerHTML = emptyEl('Keine Favoriten in diesem Ordner. Füge oben einen Stream oder Ordner hinzu.');
    return;
  }

  let html = '<div class="table-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Typ</th><th>Aktionen</th></tr></thead><tbody>';
  items.forEach((f, i) => {
    const isFolder = f.type === 'folder';
    const nameCell = isFolder
      ? `<a href="#/favorites/${f.fav_id}" style="color:var(--link);text-decoration:none">📁 ${escHtml(f.title)}</a>`
      : `📻 ${escHtml(f.title)}`;

        <td class="row-actions">

          ${isFolder ? '' : `<button class="btn-secondary btn-sm" onclick="favAddToPlaylist(${f.fav_id})">+ Playlist</button>`}

async function favAddToPlaylist(id) {
  if (!appState.currentPlayer) { showToast('Kein Player gewählt'); return; }
  const fav = (appState.favItems || []).find(x => String(x.fav_id) === String(id));
  if (!fav) { showToast('Favorit nicht gefunden'); return; }
  if (!fav.url) { showToast('Keine Stream-URL'); return; }
  try {
    // Favorit ist ein Stream (URL) → als Playlist-Eintrag hinzufügen (nicht Track-ID).
    // Titel + Logo mitgeben, damit die Playlist den Streamnamen und das Senderlogo zeigt.
    const params = ['playlist', 'add', fav.url, 'title:' + fav.title];
    if (fav.image) params.push('image:' + fav.image);
    await api('slim.request', [appState.currentPlayer, params]);
    showToast(`"${fav.title}" zur Playlist hinzugefügt`);
  } catch (e) { showToast('Fehler: ' + e.message); }
}

    const loop = alarms?.alarm_loop || [];
    const playerOpts = appState.players.map(p =>
      `<option value="${p.mac}" ${p.mac === mac ? 'selected' : ''}>${escHtml(p.name || p.mac)}</option>`).join('');
    el.innerHTML = `

            <div class="info-grid" style="grid-template-columns:auto 1fr;margin-bottom:12px">
              <span class="label">Player:</span>
              <select id="alarm-player-select" onchange="alarmSelectPlayer(this.value)" style="max-width:280px">${playerOpts}</select>
            </div>
            <div class="empty-msg" style="margin-bottom:10px">Set wake-up alarms for this player. Each alarm turns the player on, applies the volume and starts the wake source (radio stream or music-library file).</div>
            ${loop.map((a,i) => `
              <div class="alarm-row" id="alarm-row-${i}" style="border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:10px">
                <div class="info-grid" style="grid-template-columns:auto 1fr">
                  <span class="label">Alarm ${i+1}:</span>
                  <span>
                    <input type="checkbox" id="alarm-enabled-${i}" ${a.enabled ? 'checked' : ''} onchange="saveAlarm(${i})" style="vertical-align:middle">
                    <label for="alarm-enabled-${i}" style="font-size:12px">Enabled</label>
                  </span>
                </div>
                <div class="info-grid" style="grid-template-columns:auto 1fr">
                  <span class="label">Time:</span>
                  <span>
                    <select id="alarm-hour-${i}" onchange="saveAlarm(${i})">
                      ${Array.from({length:24},(_,h)=>`<option value="${h}" ${h===a.hour?'selected':''}>${String(h).padStart(2,'0')}</option>`).join('')}
                    </select>
                      <select id="alarm-minute-${i}" onchange="saveAlarm(${i})">
                      ${Array.from({length:12},(_,m)=>`<option value="${m*5}" ${m*5===a.minute?'selected':''}>${String(m*5).padStart(2,'0')}</option>`).join('')}
                    </select>
                  </span>
                </div>
                <div class="info-grid" style="grid-template-columns:auto 1fr">
                  <span class="label">Days:</span>
                  <span>
                    ${DAY_NAMES.map((d,j)=>`<label style="font-size:12px;margin-right:6px"><input type="checkbox" data-day="${j+1}" onchange="saveAlarm(${i})" ${(a.day>>(j))&1 ? 'checked' : ''}> ${d}</label>`).join('')}
                  </span>
                </div>
                <div class="info-grid" style="grid-template-columns:auto 1fr">
                  <span class="label">Volume:</span>
                  <select id="alarm-volume-${i}" onchange="saveAlarm(${i})">
                    ${Array.from({length:11},(_,v)=>`<option value="${v*10}" ${v*10===a.volume?'selected':''}>${v===0?'current':(v*10)+'%'}</option>`).join('')}
                  </select>
                </div>
                <div class="info-grid" style="grid-template-columns:auto 1fr">
                  <span class="label">Wake source:</span>
                  <span>
                    <button class="btn-secondary btn-sm" onclick="alarmPickSource(${i})">📻 Choose stream / file…</button>
                    <span id="alarm-wake-label-${i}" style="font-size:12px;color:var(--text-light);margin-left:8px">${escHtml(alarmWakeLabel(a, i))}</span>
                  </span>
                </div>
                <div style="margin-top:8px">
                  <button class="btn-secondary btn-sm" onclick="deleteAlarm(${i})">🗑 Delete</button>
                </div>
              </div>
            `).join('')}
            <div style="text-align:center">
              <button class="btn-secondary" onclick="addAlarm()">➕ New Alarm</button>
            </div>
          </div>
        </div>
      </div>
    `;
  } catch(e) {
    el.innerHTML = errEl('Could not load alarms: ' + e.message);
  }
}

async function alarmSelectPlayer(mac) {
  appState.alarmPlayer = mac;
  renderAlarmSettings();
}

async function saveAlarm(i, wake) {
  const mac = appState.alarmPlayer || (appState.players.find(p => p.connected)?.mac || '');
  const enabled = document.getElementById(`alarm-enabled-${i}`)?.checked ? 1 : 0;
  const hour = parseInt(document.getElementById(`alarm-hour-${i}`)?.value ?? 0, 10);
  const minute = parseInt(document.getElementById(`alarm-minute-${i}`)?.value ?? 0, 10);
  const volume = parseInt(document.getElementById(`alarm-volume-${i}`)?.value ?? -1, 10);
  let day = 0;
  document.querySelectorAll(`#alarm-row-${i} input[data-day]`).forEach(cb => {
    if (cb.checked) day |= (1 << (parseInt(cb.dataset.day, 10) - 1));
  });
  try {
    const args = ['alarm', String(i), `enabled:${enabled}`, `hour:${hour}`, `minute:${minute}`, `volume:${volume}`,
                  `day:${day}`];
    if (wake && wake.wake) args.push(`wake:${wake.wake}`);
    await api('slim.request', [mac || '-', args]);
    if (wake && wake.wake) renderAlarmSettings();  // refresh the wake label
    showToast('Alarm gespeichert');
  } catch(e) { showToast('Fehler: ' + e.message); }
}

// Store a chosen wake source for alarm<i> without reverting other fields.
async function alarmSetWake(i, wake) {
  const mac = appState.alarmPlayer || (appState.players.find(p => p.connected)?.mac || '');
  try {
    await api('slim.request', [mac || '-', ['alarm', String(i), `wake:${wake}`]]);
    renderAlarmSettings();
    showToast('Weckquelle gesetzt');
  } catch(e) { showToast('Fehler: ' + e.message); }
}

async function addAlarm() {
  const mac = appState.alarmPlayer || (appState.players.find(p => p.connected)?.mac || '');
  try {
    // find first free alarm index (0..15)
    const alarms = await api('slim.request', [mac || '-', ['alarms', '0', '16']]);
    const used = new Set((alarms?.alarm_loop || []).map(a => a.id));
    let slot = 0;
    while (slot < 16 && used.has(slot)) slot++;
    if (slot >= 16) { showToast('Maximal 16 Alarme'); return; }
    await api('slim.request', [mac || '-', ['alarm', String(slot), 'enabled:0', 'hour:7', 'minute:0', 'day:127', 'volume:-1']]);
    renderAlarmSettings();
    showToast(`Alarm ${slot+1} angelegt`);
  } catch(e) { showToast('Fehler: ' + e.message); }
}

async function deleteAlarm(i) {
  const mac = appState.alarmPlayer || (appState.players.find(p => p.connected)?.mac || '');
  try {
    await api('slim.request', [mac || '-', ['alarm', String(i), 'delete']]);
    renderAlarmSettings();
    showToast('Alarm gelöscht');
  } catch(e) { showToast('Fehler: ' + e.message); }
}

function alarmCloseDialog() {
  const ov = document.getElementById('alarm-picker-overlay');
  if (ov) ov.remove();
}

// Open the wake-source chooser: favorites (streams) or music-library tracks.
async function alarmPickSource(i) {
  appState._alarmPickIndex = i;
  let ov = document.getElementById('alarm-picker-overlay');
  if (ov) ov.remove();
  ov = document.createElement('div');
  ov.id = 'alarm-picker-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center';
  const box = document.createElement('div');
  box.style.cssText = 'background:var(--bg,#fff);color:var(--text,#333);border-radius:8px;max-width:600px;width:90%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.4)';
  box.innerHTML = `
    <div style="padding:12px 16px;border-bottom:1px solid var(--border,#ddd);font-weight:600">Weckquelle für Alarm ${i+1}</div>
    <div style="display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border,#eee)">
      <button class="btn-secondary btn-sm ${'alarm-pick-tab'} active" data-tab="fav" onclick="alarmTab(this,'fav')">📻 Favoriten / Streams</button>
      <button class="btn-secondary btn-sm ${'alarm-pick-tab'}" data-tab="songs" onclick="alarmTab(this,'songs')">🎵 Musiksammlung</button>
    </div>
    <div id="alarm-picker-body" style="overflow:auto;flex:1;padding:12px 16px;min-height:200px"></div>
    <div style="padding:10px 16px;border-top:1px solid var(--border,#eee);text-align:right">
      <button class="btn btn" onclick="alarmCloseDialog()">Abbrechen</button>
    </div>`;
  ov.appendChild(box);
  document.body.appendChild(ov);
  await alarmTab(box.querySelector('[data-tab=fav]'), 'fav');
}

function alarmTab(btn, tab) {
  document.querySelectorAll('.alarm-pick-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (tab === 'fav') alarmLoadFavorites();
  else alarmLoadSongs('');
}

async function alarmLoadFavorites() {
  const body = document.getElementById('alarm-picker-body');
  body.innerHTML = loadingEl();
  try {
    const r = await api('slim.request', ['-', ['favorites', 'items']]);
    const items = parseFavItems(r).filter(f => f.type !== 'folder');
    if (!items.length) { body.innerHTML = emptyEl('Keine Favoriten/Streams.'); return; }
    body.innerHTML = items.map(f => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border,#eee)">
        <span>${escHtml(f.title || f.url)}</span>
        <a href="#" onclick="alarmChooseWake(event,'fr:${encodeURIComponent(f.fav_id)}','${escHtml(f.title||'').replace(/'/g,"&#39;")}');return false">Auswählen</a>
      </div>`).join('');
  } catch(e) { body.innerHTML = errEl(e.message); }
}

// Music-library track chooser (search box + list).
async function alarmLoadSongs(term) {
  const body = document.getElementById('alarm-picker-body');
  body.innerHTML = `
    <input id="alarm-song-search" type="text" placeholder="Suchen…" value="${escHtml(term||'')}" style="width:100%;box-sizing:border-box;padding:6px;margin-bottom:10px;border:1px solid var(--border,#ddd);border-radius:3px"
      oninput="alarmLoadSongs(this.value)">
    <div id="alarm-song-list">${loadingEl()}</div>`;
  try {
    const q = term ? ['songs', '0', '200', 'tags:', 'title', term] : ['songs', '0', '200', 'tags:'];
    const r = await api('slim.request', [appState.alarmPlayer || '-', q]);
    const tracks = (r && (r.titles_loop || r.item_list || r.loop_loop || [])) || [];
    const list = document.getElementById('alarm-song-list');
    if (!tracks.length) { list.innerHTML = emptyEl('Keine Titel.'); return; }
    list.innerHTML = tracks.map(s => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 2px;border-bottom:1px solid var(--border,#eee)">
        <span>${escHtml(s.title||s.titile||'')} <small style="color:var(--text-light)">${escHtml(s.artist||s.creator||'')}</small></span>
        <a href="#" onclick="alarmChooseWake(event,'track:${s.id}','${escHtml((s.title||'').replace(/'/g,"&#39;"))}');return false">Auswählen</a>
      </div>`).join('');
  } catch(e) { const l=document.getElementById('alarm-song-list'); if(l) l.innerHTML = errEl(e.message); }
}

// Confirm and store the chosen wake source for the last-clicked alarm.
async function alarmChooseWake(ev, wake, label) {
  ev.preventDefault();
  const i = appState._alarmPickIndex;
  // store display label client-side (avoid "🎵 1" instead of the track name)
  appState._alarmWakeLabels = appState._alarmWakeLabels || {};
  appState._alarmWakeLabels[i] = label || wake;
  alarmCloseDialog();
  await alarmSetWake(i, wake);
}

function alarmWakeLabel(a, i) {
  const cached = (appState._alarmWakeLabels || {})[i];
  if (cached) return cached;
  if (!a) return 'none';
  if (a.wake) return a.wake.replace(/^url:/, '').replace(/^track:/, '🎵 ').replace(/^fr:/, '📻 ').replace(/^wake:/, '');
  if (a.url) return a.url;
  return 'none';
}

async function togglePlayerPower(mac) {
  const p = appState.players.find(pl => pl.mac === mac);
  if (!p) return;
  try {
    await api('player.power', [mac, !p.power]);
    p.power = !p.power;
    renderSettings('players');
  } catch(e) { showToast('Error: ' + e.message); }
}

function selectPlayer(mac) {
  appState.currentPlayer = mac;
  sessionStorage.setItem('currentPlayer', mac);
  showToast('Player selected');
  navigate();
}

async function saveLibraryPath() {
  const input = document.getElementById('musicdir-input');
  if (!input) return;
  const p = input.value.trim();
  if (!p) { showToast('Path is empty'); return; }
  try {
    await api('slim.request', ['-', ['serverpref', 'musicdir', p]]);
    showToast('Music library path saved: ' + p);
  } catch (e) {
    showToast('Failed: ' + e.message);
  }
}

async function rescanLibrary() {
  showToast('Library rescan initiated…');
  try {
    await api('rescan');
    showToast('Library rescan running in background');
  } catch (e) {
    showToast('Rescan failed: ' + e.message);
  }
}

// ─────────────────────────────────────────────
//  TOAST NOTIFICATIONS
// ─────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = `
      position: fixed;
      bottom: 60px;
      right: 20px;
      background: #333;
      color: #fff;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 13px;
      z-index: 9999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: opacity 0.3s;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2500);
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
(async function init() {
  // Sidebar collapse on mobile
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
  }

  // Load server + players
  await refreshServerInfo();
  await refreshPlayers();
  await refreshStatus();

  // Auto-refresh status every 10s (server/players) and, faster, the Now
  // Playing panel so the play/pause icon tracks the real player state.
  appState.refreshInterval = setInterval(refreshStatus, 10000);
  appState.npPollInterval = setInterval(pollNowPlaying, 3000);

  // Initial route
  if (!location.hash) location.hash = '#/nowplaying';
  await navigate();

  // Close sidebar on outside click (mobile)
  document.addEventListener('click', (e) => {
    const sidebar = document.getElementById('sidebar');
    const toggle = document.getElementById('sidebar-toggle');
    if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
      if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    }
  });
})();
</script>
