   function addJsToDocument(path, js, rev) {
     for (let i=0, len=js.length; i<len; ++i) {
       var element = document.createElement("script");
       element.src = path+js[i]+".js?r="+rev;
       document.body.appendChild(element);
     }
   }
   function addCssToDocument(path, css, rev) {
     for (let i=0, len=css.length; i<len; ++i) {
       var element = document.createElement("link");
       element.href = path+css[i]+".css?r="+rev;
       element.rel = "stylesheet";
       document.body.appendChild(element);
     }
   }
   function loadOtherFiles() {
     addJsToDocument("html/js/", ["browse-resp", "browse-functions", "nowplaying-functions", "prompt-dialog", "choice-dialog", "standarditems", "sync-dialog", "groupplayers-dialog", "ui-settings", "player-settings", "player-settings-plugin", "volume", "information", "randommix-dialog", "rating-dialog", "manage-players", "playerlist-dialog", "favorite-dialog", "sleep-dialog", "info-dialog", "iframe-dialog", "icon-dialog", "dstm-dialog", "savequeue-dialog", "addtoplaylist-dialog", "file-dialog", "groupvolume-dialog", "advancedsearch-dialog", "npshare-dialog", "download", "gallery", "utils-deferred"],

     addJsToDocument("html/lib/photoswipe/", ["photoswipe.min", "photoswipe-ui-default.min"], "4.1.2");
   }
   // DEFFERED end
   if (window.addEventListener) {
     window.addEventListener("load", loadOtherFiles, false);
   } else if (window.attachEvent) {
     window.attachEvent("onload", loadOtherFiles);
   } else {
     window.onload = loadOtherFiles;
